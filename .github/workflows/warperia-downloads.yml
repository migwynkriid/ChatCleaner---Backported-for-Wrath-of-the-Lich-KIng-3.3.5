name: Update Downloads Badge

# Combines GitHub release downloads + Warperia + CurseForge into a single total,
# and stores it in a GitHub Gist (NOT this repo, so it never creates commits).
# The README badge reads the total from that gist via shields.io's endpoint
# renderer. CurseForge is fetched from the official api.curseforge.com and counts
# as 0 if it is unavailable or not configured.
#
# Gist: https://gist.github.com/migwynkriid/5137d5c66c70a38da67ae68bcf41b97c
#
# One-time setup: create a Personal Access Token with the "gist" scope
# (https://github.com/settings/tokens, classic, check "gist"), then add it to
# this repo as a secret named GIST_TOKEN:
#   Settings > Secrets and variables > Actions > New repository secret
# Nothing is committed to this repository by this workflow.

on:
  schedule:
    # Once per day (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: warperia-downloads
  cancel-in-progress: false

# No repo write access needed: the badge lives in a gist, not this repo.
permissions:
  contents: read

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch combined download count
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GIST_ID: 5137d5c66c70a38da67ae68bcf41b97c
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_CORE_API_KEY: ${{ secrets.CF_CORE_API_KEY }}
        run: |
          python3 <<'PY'
          import json, os, re, urllib.request

          def get(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              return urllib.request.urlopen(req, timeout=30)

          # Previous run's per-source values (for OLD>NEW logging), stored in the
          # same gist. Missing on the very first run.
          old = {}
          try:
              old = json.loads(get(
                  "https://gist.githubusercontent.com/migwynkriid/%s/raw/downloads-breakdown.json"
                  % os.environ.get("GIST_ID", "")
              ).read().decode("utf-8"))
          except Exception:
              old = {}

          # Each source is independent: if one fails it counts as 0 and the
          # others still contribute, so the workflow never fails.

          # 1) Warperia download count (scraped from the addon page).
          warperia = 0
          try:
              wurl = "https://warperia.com/addon-wotlk/cleanerchat/"
              html = get(wurl, {"User-Agent": "Mozilla/5.0"}).read().decode("utf-8", "replace")
              m = re.search(r"Downloads:.*?bi-download.*?</i>\s*([\d,]+)", html, re.S)
              if not m:
                  raise ValueError("could not parse download count")
              warperia = int(m.group(1).replace(",", ""))
          except Exception as e:
              print("::warning::Warperia count unavailable (using 0): %s" % e)

          # 2) GitHub release downloads (sum of every release asset, all pages).
          github = 0
          try:
              repo = os.environ["GH_REPO"]
              token = os.environ.get("GH_TOKEN", "")
              headers = {"User-Agent": "badge-bot", "Accept": "application/vnd.github+json"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              g = 0
              page = 1
              while True:
                  url = "https://api.github.com/repos/%s/releases?per_page=100&page=%d" % (repo, page)
                  releases = json.loads(get(url, headers).read().decode("utf-8"))
                  if not releases:
                      break
                  for rel in releases:
                      for asset in rel.get("assets", []):
                          g += asset.get("download_count", 0)
                  page += 1
              github = g
          except Exception as e:
              print("::warning::GitHub count unavailable (using 0): %s" % e)

          # 3) CurseForge downloads via the official CurseForge API.
          curseforge = 0
          try:
              cf_id = os.environ.get("CF_PROJECT_ID", "")
              cf_key = os.environ.get("CF_CORE_API_KEY", "")
              if cf_id and cf_key:
                  cf = get(
                      "https://api.curseforge.com/v1/mods/" + cf_id,
                      {
                          "x-api-key": cf_key,
                          "Accept": "application/json",
                          "User-Agent": "badge-bot",
                      },
                  )
                  data = json.loads(cf.read().decode("utf-8"))
                  curseforge = int(data.get("data", {}).get("downloadCount", 0) or 0)
              else:
                  print("::warning::CurseForge skipped: set CF_CORE_API_KEY secret and CF_PROJECT_ID variable.")
          except Exception as e:
              print("::warning::CurseForge count unavailable (using 0): %s" % e)

          total = github + warperia + curseforge
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("total=%d\n" % total)

          new = {"github": github, "warperia": warperia, "curseforge": curseforge, "total": total}

          def chg(k):
              o = old.get(k)
              return "%s>%s" % ("?" if o is None else o, new[k])

          print(
              "::notice::GitHub %s | Warperia %s | CurseForge %s | Total %s"
              % (chg("github"), chg("warperia"), chg("curseforge"), chg("total"))
          )

          # Save this run's breakdown to the gist so the next run can show OLD>NEW.
          gist_id = os.environ.get("GIST_ID", "")
          gist_token = os.environ.get("GIST_TOKEN", "")
          if gist_id and gist_token:
              try:
                  payload = json.dumps(
                      {"files": {"downloads-breakdown.json": {"content": json.dumps(new)}}}
                  ).encode("utf-8")
                  req = urllib.request.Request(
                      "https://api.github.com/gists/" + gist_id,
                      data=payload,
                      method="PATCH",
                      headers={
                          "Authorization": "Bearer " + gist_token,
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "badge-bot",
                      },
                  )
                  urllib.request.urlopen(req, timeout=30)
              except Exception as e:
                  print("::warning::Could not save breakdown to gist: %s" % e)
          PY

      - name: Update gist badge
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 5137d5c66c70a38da67ae68bcf41b97c
          filename: warperia-downloads.json
          label: downloads
          message: ${{ steps.fetch.outputs.total }}
          color: 1784b8
